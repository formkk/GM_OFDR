name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 产品主线：GM-IX
      - name: Build GM-IX
        run: dotnet build GM-IX/src/Gmix.sln -c Release

      - name: Test GM-IX
        run: dotnet run --project GM-IX/src/Gmix.Tests -c Release --no-build

      # 预研平台：ofdr_platform（未接硬件，冻结）
      - name: Build platform
        run: dotnet build ofdr_platform/src/OFDR.Platform.sln -c Release

      - name: Verify platform
        run: dotnet run --project ofdr_platform/src/OFDR.Verify -c Release --no-build

      # L1 数据契约机械检查
      - name: Check data contract
        shell: pwsh
        run: ./LGA50/tools/check_contract.ps1
