name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 产品主线：GM-IX
      - name: Build GM-IX
        run: dotnet build products/gmix/src/Gmix.sln -c Release

      - name: Test GM-IX
        run: dotnet run --project products/gmix/src/Gmix.Tests -c Release --no-build

      # 检测平台：OCS + OFDR（阶段 A：Vendor 层）
      - name: Build detection
        run: dotnet build products/detection/Detection.sln -c Release

      - name: Test detection vendor
        run: dotnet run --project products/detection/src/Detection.Tests -c Release --no-build

      # GM-IX-LX：映讯 GM-IX OFDR 专用上位机（检测平台裁剪版）
      - name: Build GM-IX-LX
        run: dotnet build products/gmix-lx/GmixLx.sln -c Release

      - name: Test GM-IX-LX
        run: dotnet run --project products/gmix-lx/src/GmixLx.Tests -c Release --no-build

      # 预研平台：ofdr_platform（未接硬件，冻结）
      - name: Build platform
        run: dotnet build research/platform/src/OFDR.Platform.sln -c Release

      - name: Verify platform
        run: dotnet run --project research/platform/src/OFDR.Verify -c Release --no-build

      # L1 数据契约机械检查
      - name: Check data contract
        shell: pwsh
        run: ./devices/lga50/tools/check_contract.ps1
