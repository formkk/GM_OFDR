name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ofdr_platform/src/OFDR.Platform.sln -c Release

      - name: Verify
        run: dotnet run --project ofdr_platform/src/OFDR.Verify -c Release --no-build
